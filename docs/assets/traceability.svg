<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Traceability graph</title>
  <desc id="d">Nodes link requirement to PRD item, architecture decision, code symbol, test case, execution, failure, bug, hypothesis, repair, and validation.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#0d1117"/>
  <text x="480" y="38" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Traceability graph</text>
  <text x="480" y="60" fill="#8b949e" font-size="12.5" text-anchor="middle">every change traces back to a requirement — managed by traceability-keeper</text>

  <g font-size="12" text-anchor="middle">
    <!-- row 1 -->
    <g fill="#f0f6fc">
      <rect x="30" y="96" width="120" height="46" rx="9" fill="#161b22" stroke="#388bfd"/><text x="90" y="124">Requirement</text>
      <rect x="190" y="96" width="120" height="46" rx="9" fill="#161b22" stroke="#388bfd"/><text x="250" y="124">PRD Item</text>
      <rect x="350" y="96" width="120" height="46" rx="9" fill="#161b22" stroke="#8957e5"/><text x="410" y="124">Arch Decision</text>
      <rect x="510" y="96" width="120" height="46" rx="9" fill="#161b22" stroke="#d97757"/><text x="570" y="124">Code Symbol</text>
      <rect x="670" y="96" width="120" height="46" rx="9" fill="#161b22" stroke="#2ead33"/><text x="730" y="124">Test Case</text>
      <rect x="830" y="96" width="110" height="46" rx="9" fill="#161b22" stroke="#2ead33"/><text x="885" y="124">Execution</text>
    </g>
    <!-- row 2 -->
    <g fill="#f0f6fc">
      <rect x="830" y="230" width="110" height="46" rx="9" fill="#161b22" stroke="#e5534b"/><text x="885" y="258">Failure</text>
      <rect x="670" y="230" width="120" height="46" rx="9" fill="#161b22" stroke="#e5534b"/><text x="730" y="258">Bug</text>
      <rect x="510" y="230" width="120" height="46" rx="9" fill="#161b22" stroke="#d9a441"/><text x="570" y="258">Hypothesis</text>
      <rect x="350" y="230" width="120" height="46" rx="9" fill="#161b22" stroke="#d97757"/><text x="410" y="258">Repair</text>
      <rect x="190" y="230" width="120" height="46" rx="9" fill="#161b22" stroke="#2ead33"/><text x="250" y="258">Validation</text>
    </g>
  </g>

  <!-- edges with verbs -->
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M150,119 L188,119"/>
    <path d="M310,119 L348,119"/>
    <path d="M470,119 L508,119"/>
    <path d="M630,119 L668,119"/>
    <path d="M790,119 L828,119"/>
    <path d="M885,142 L885,228"/>
    <path d="M830,253 L792,253"/>
    <path d="M670,253 L632,253"/>
    <path d="M510,253 L472,253"/>
    <path d="M350,253 L312,253"/>
  </g>
  <g fill="#8b949e" font-size="10.5" text-anchor="middle">
    <text x="169" y="112">derives</text>
    <text x="329" y="112">implements</text>
    <text x="489" y="112">implements</text>
    <text x="649" y="112">tests</text>
    <text x="809" y="112">executes</text>
    <text x="905" y="190">fails</text>
    <text x="811" y="246">reports</text>
    <text x="651" y="246">hypothesizes</text>
    <text x="491" y="246">repairs</text>
    <text x="331" y="246">validates</text>
  </g>

  <path d="M250,276 Q250,320 90,320 Q90,180 90,144" stroke="#2ead33" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="150" y="340" fill="#2ead33" font-size="10.5">re-validates requirement</text>
</svg>
