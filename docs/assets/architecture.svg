<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">developer-assistant-skills architecture</title>
  <desc id="desc">Runtimes call thin adapters, which resolve to the .developer canonical library, which drives external tooling via a CLI-first, MCP-fallback layer.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#0d1117"/>

  <!-- Layer 1: Runtimes -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Runtimes</text>
  <g>
    <rect x="120" y="60" width="200" height="56" rx="10" fill="url(#panel)" stroke="#d97757"/>
    <text x="220" y="94" fill="#f0f6fc" font-size="15" text-anchor="middle">Claude Code</text>
    <rect x="380" y="60" width="200" height="56" rx="10" fill="url(#panel)" stroke="#388bfd"/>
    <text x="480" y="94" fill="#f0f6fc" font-size="15" text-anchor="middle">GitHub Copilot</text>
    <rect x="640" y="60" width="200" height="56" rx="10" fill="url(#panel)" stroke="#8957e5"/>
    <text x="740" y="94" fill="#f0f6fc" font-size="15" text-anchor="middle">Codex / any agent</text>
  </g>

  <!-- Layer 2: Adapters -->
  <text x="480" y="164" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Thin adapters</text>
  <g fill="#c9d1d9" font-size="12.5" text-anchor="middle">
    <rect x="120" y="180" width="200" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="220" y="208">.claude/commands/dev · /dev:</text>
    <rect x="380" y="180" width="200" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="480" y="208">.github/prompts · /skill</text>
    <rect x="640" y="180" width="200" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="740" y="208">AGENTS.md · by path</text>
  </g>

  <!-- Layer 3: canonical -->
  <rect x="90" y="264" width="780" height="196" rx="14" fill="#10161f" stroke="#d97757" stroke-width="1.5"/>
  <text x="480" y="292" fill="#d97757" font-size="18" font-weight="700" text-anchor="middle">.developer/ — canonical source of truth</text>
  <g font-size="13" text-anchor="middle">
    <rect x="112" y="308" width="150" height="60" rx="9" fill="url(#panel)" stroke="#30363d"/>
    <text x="187" y="334" fill="#f0f6fc">skills · 34</text>
    <text x="187" y="352" fill="#8b949e" font-size="11">10 lifecycle groups</text>

    <rect x="278" y="308" width="150" height="60" rx="9" fill="url(#panel)" stroke="#30363d"/>
    <text x="353" y="334" fill="#f0f6fc">agents · 20</text>
    <text x="353" y="352" fill="#8b949e" font-size="11">15 critics · 5 leads</text>

    <rect x="444" y="308" width="150" height="60" rx="9" fill="url(#panel)" stroke="#30363d"/>
    <text x="519" y="334" fill="#f0f6fc">config</text>
    <text x="519" y="352" fill="#8b949e" font-size="11">config.json + companions</text>

    <rect x="610" y="308" width="150" height="60" rx="9" fill="url(#panel)" stroke="#30363d"/>
    <text x="685" y="334" fill="#f0f6fc">mcp</text>
    <text x="685" y="352" fill="#8b949e" font-size="11">github · playwright · ado</text>

    <rect x="195" y="384" width="200" height="56" rx="9" fill="url(#panel)" stroke="#30363d"/>
    <text x="295" y="410" fill="#f0f6fc">scripts</text>
    <text x="295" y="428" fill="#8b949e" font-size="11">cli · traceability · gen-commands</text>

    <rect x="565" y="384" width="200" height="56" rx="9" fill="url(#panel)" stroke="#30363d"/>
    <text x="665" y="410" fill="#f0f6fc">docs</text>
    <text x="665" y="428" fill="#8b949e" font-size="11">design · skill-sources</text>
  </g>

  <!-- Layer 4: tooling -->
  <text x="480" y="500" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Tooling — CLI-first, MCP-fallback</text>
  <g fill="#c9d1d9" font-size="13" text-anchor="middle">
    <rect x="150" y="516" width="140" height="46" rx="8" fill="#161b22" stroke="#2ead33"/>
    <text x="220" y="544">gh (GitHub)</text>
    <rect x="310" y="516" width="140" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="380" y="544">az (ADO, opt)</text>
    <rect x="470" y="516" width="140" height="46" rx="8" fill="#161b22" stroke="#2ead33"/>
    <text x="540" y="544">npx playwright</text>
    <rect x="630" y="516" width="140" height="46" rx="8" fill="#161b22" stroke="#663399"/>
    <text x="700" y="544">npx axe</text>
  </g>

  <!-- connectors -->
  <g stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)" fill="none">
    <path d="M220,116 L220,178"/>
    <path d="M480,116 L480,178"/>
    <path d="M740,116 L740,178"/>
    <path d="M220,226 L300,262"/>
    <path d="M480,226 L480,262"/>
    <path d="M740,226 L660,262"/>
    <path d="M480,460 L480,514"/>
  </g>
</svg>
